name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --all-targets

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install C toolchain for reference binary
        run: sudo apt-get update && sudo apt-get install -y build-essential
      - run: cargo test

  doc:
    name: Docs
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -Dwarnings
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --no-deps

  miri:
    name: Miri (${{ matrix.borrows }} borrows)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Run the soundness suite under both aliasing models. They disagree
        # on borderline cases, so a clean bill of health from both gives
        # the strongest guarantee.
        include:
          - borrows: stacked
            miriflags: -Zmiri-disable-isolation
          - borrows: tree
            miriflags: -Zmiri-disable-isolation -Zmiri-tree-borrows
    env:
      # -Dwarnings (set globally for the workflow) breaks the build when
      # miri's instrumented std emits any lint, so override here. The
      # release jobs above remain strict.
      RUSTFLAGS: ""
      MIRIFLAGS: ${{ matrix.miriflags }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - uses: Swatinem/rust-cache@v2
        with:
          # miri builds a separate target/miri directory, so cache it too.
          shared-key: miri-${{ matrix.borrows }}
      - name: Run miri soundness suite
        run: cargo miri test --test miri_soundness
