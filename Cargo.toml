[package]
name = "cost-scaling-rs"
version = "0.1.0"
edition = "2024"
authors = ["Vinícius Freitas de Almeida <vinifreitas.d.a@gmail.com>"]
description = "CS2 minimum-cost maximum-flow algorithm (cost-scaling successive approximation)"
license = "MIT"
repository = "https://github.com/vini-fda/cost_scaling_rs"
keywords = ["min-cost-flow", "network-flow", "optimization", "graph", "cs2"]
categories = ["algorithms", "science"]
rust-version = "1.85"

[dependencies]

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }

[[bench]]
name = "cs2_bench"
harness = false

[profile.release]
lto = "fat"
codegen-units = 1
strip = true

[profile.profiling]
inherits = "release"
strip = false
debug = 2

[profile.bench]
inherits = "release"
debug = 2

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unreachable_pub = "warn"        # catches over-exported items
unused_qualifications = "warn"
unused_lifetimes = "warn"
single_use_lifetimes = "warn"
redundant_lifetimes = "warn"
meta_variable_misuse = "warn"

[lints.rustdoc]
broken_intra_doc_links = "deny"
missing_crate_level_docs = "warn"
private_intra_doc_links = "warn"
bare_urls = "warn"

[lints.clippy]
unwrap_used = "deny"
undocumented_unsafe_blocks = "deny"
missing_safety_doc = "deny"
# Cherry-picked from clippy::pedantic — the parts that are real findings
# rather than noise on numeric casts / hot-path inline(always) attributes.
doc_markdown = "warn"
redundant_closure_for_method_calls = "warn"
manual_let_else = "warn"
redundant_else = "warn"
single_match_else = "warn"
format_push_string = "warn"
case_sensitive_file_extension_comparisons = "warn"
similar_names = "warn"
float_cmp = "warn"
map_unwrap_or = "warn"
must_use_candidate = "warn"
missing_errors_doc = "warn"
cast_lossless = "warn"
cloned_instead_of_copied = "warn"
stable_sort_primitive = "warn"
uninlined_format_args = "warn"
if_not_else = "warn"
assigning_clones = "warn"
